{% extends "base.html" %}

{% block title %}{{ note.title if note else 'Untitled Note' }} - StudyMate{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">

<!-- Obsidian-style Notes Interface -->
<div class="obsidian-notes-container">
    <!-- Floating Action Bar -->
    <div class="floating-action-bar">
        <a href="{{ url_for('topic.view_topic', topic_id=topic_id) if topic_id else url_for('dashboard') }}" class="action-btn" title="Back to Topic">
            <span class="icon">←</span>
        </a>
        <div class="action-spacer"></div>
        <button class="action-btn" id="viewModeEdit" onclick="setViewMode('edit')" title="Edit mode (Ctrl+E)">
            <span class="icon">✏️</span>
        </button>
        <button class="action-btn" id="viewModeSplit" onclick="setViewMode('split')" title="Split view (Ctrl+Shift+E)">
            <span class="icon">⟷</span>
        </button>
        <button class="action-btn" id="viewModePreview" onclick="setViewMode('preview')" title="Preview mode (Ctrl+Shift+P)">
            <span class="icon">👁️</span>
        </button>
        <div class="action-divider"></div>
        <span class="status-text" id="statusText">{{ note.title if note else 'Untitled Note' }}</span>
        <span class="word-count" id="wordCount">0 words</span>
        <div class="action-divider"></div>
        {% if note %}
            <button class="action-btn danger" onclick="deleteNote()" title="Delete note">
                <span class="icon">🗑️</span>
            </button>
        {% endif %}
    </div>

    <!-- Main Editor Area -->
    <div class="obsidian-editor-panes" id="editorPanes">
        <!-- Edit Pane -->
        <div class="editor-pane" id="editPane">
            <div class="editor-wrapper">
                <textarea class="obsidian-editor" id="noteEditor" placeholder="# Untitled Note

Start writing your notes here...

Supports full Markdown syntax:
- **Bold** and *italic*
- Lists and checkboxes
- Code blocks
- Links and more">{{ note.content if note else '' }}</textarea>
            </div>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane" id="previewPane">
            <div class="preview-wrapper">
                <div class="obsidian-preview" id="markdownPreview">
                    <p class="preview-placeholder">Preview will appear here...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('noteEditor');
    const wordCountSpan = document.getElementById('wordCount');
    const statusText = document.getElementById('statusText');
    const previewDiv = document.getElementById('markdownPreview');
    const editorPanes = document.getElementById('editorPanes');
    const editPane = document.getElementById('editPane');
    const previewPane = document.getElementById('previewPane');
    
    let currentMode = 'split'; // edit, preview, split
    let autoSaveTimer = null;
    let hasUnsavedChanges = false;

    // Extract title from content (first line if it starts with #)
    function extractTitle() {
        const content = editor.value.trim();
        const firstLine = content.split('\n')[0];
        if (firstLine.startsWith('#')) {
            return firstLine.replace(/^#+\s*/, '').trim() || 'Untitled Note';
        }
        return content.split('\n')[0].substring(0, 50) || 'Untitled Note';
    }

    // Update word count and status
    function updateMetadata() {
        const text = editor.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        wordCountSpan.textContent = `${words} word${words !== 1 ? 's' : ''}`;
        
        const title = extractTitle();
        statusText.textContent = title;
        document.title = `${title} - StudyMate`;
    }

    // View mode management
    function setViewMode(mode) {
        currentMode = mode;
        
        // Update button states
        document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('viewMode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
        
        // Update pane visibility
        editorPanes.className = 'obsidian-editor-panes mode-' + mode;
        
        if (mode === 'preview' || mode === 'split') {
            renderMarkdown();
        }
    }

    // Render markdown preview
    function renderMarkdown() {
        const markdown = editor.value;
        
        fetch('/note/preview', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ content: markdown }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.html) {
                previewDiv.innerHTML = data.html;
            } else {
                previewDiv.innerHTML = '<p class="preview-placeholder">Preview not available</p>';
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            previewDiv.innerHTML = '<p class="preview-placeholder error">Error rendering preview</p>';
        });
    }

    // Auto-save functionality
    function scheduleAutoSave() {
        hasUnsavedChanges = true;
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
            {% if note %}
            updateNote(true);
            {% else %}
            saveNote(true);
            {% endif %}
        }, 2000); // Auto-save after 2 seconds of inactivity
    }

    // Event listeners
    editor.addEventListener('input', () => {
        updateMetadata();
        if (currentMode === 'split') {
            renderMarkdown();
        }
        scheduleAutoSave();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        // Save: Ctrl+S
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
            e.preventDefault();
            {% if note %}
            updateNote(false);
            {% else %}
            saveNote(false);
            {% endif %}
        }
        // Edit mode: Ctrl+E
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === 'e') {
            e.preventDefault();
            setViewMode('edit');
        }
        // Split view: Ctrl+Shift+E
        if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'E') {
            e.preventDefault();
            setViewMode('split');
        }
        // Preview mode: Ctrl+Shift+P
        if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'P') {
            e.preventDefault();
            setViewMode('preview');
        }
    });

    // Initialize
    updateMetadata();
    setViewMode('split');

    // Save new note
    function saveNote(isAutoSave = false) {
        const title = extractTitle();
        const content = editor.value.trim();
        
        if (!isAutoSave) {
            statusText.textContent = 'Saving...';
        }
        
        fetch(`/note/{{ topic_id }}/note`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ title, content }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (!isAutoSave) {
                    // Redirect to the edit page for the new note
                    window.location.href = data.redirect_url;
                } else {
                    hasUnsavedChanges = false;
                    statusText.textContent = title + ' (saved)';
                    setTimeout(() => statusText.textContent = title, 2000);
                }
            } else {
                statusText.textContent = title + ' (error saving)';
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            statusText.textContent = title + ' (error)';
        });
    }

    {% if note %}
    // Update existing note
    function updateNote(isAutoSave = false) {
        const title = extractTitle();
        const content = editor.value.trim();
        
        if (!isAutoSave) {
            statusText.textContent = 'Saving...';
        }
        
        fetch(`/note/{{ note.id }}/update`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ title, content }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                hasUnsavedChanges = false;
                if (!isAutoSave) {
                    statusText.textContent = title + ' (saved)';
                    setTimeout(() => statusText.textContent = title, 2000);
                }
            } else {
                statusText.textContent = title + ' (error saving)';
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            statusText.textContent = title + ' (error)';
        });
    }
    
    // Delete note
    function deleteNote() {
        if (confirm('Are you sure you want to delete this note?')) {
            fetch('/note/delete/{{ note.id }}', {
                method: 'POST',
            })
            .then(() => {
                window.location.href = '{{ url_for("topic.view_topic", topic_id=topic_id) if topic_id else url_for("dashboard") }}';
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Error deleting note');
            });
        }
    }
    {% endif %}
    
    // Warn about unsaved changes
    window.addEventListener('beforeunload', (e) => {
        if (hasUnsavedChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
</script>
{% endblock %}
